<!doctype html>
<html lang="en" class="oa-dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenTabs packs</title>
  <meta name="description" content="Topics, sources and themes for OpenTabs, shared by the people who assembled them." />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="apple-touch-icon" href="/icon-180.png" />
  <link rel="canonical" href="https://market.opentabs.app/" />
  <meta name="theme-color" content="#101014" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="OpenTabs packs" />
  <meta property="og:title" content="OpenTabs packs" />
  <meta property="og:description" content="A topic someone spent an hour assembling, as one click. Nothing about you is stored to browse, and nothing is stored to install." />
  <meta property="og:url" content="https://market.opentabs.app/" />
  <!-- Absolute, on this origin. A crawler cannot resolve a relative path,
       and market.opentabs.app does not fall back to the apex for /favicon.ico
       or anything else — it is a different origin and needs its own copies. -->
  <meta property="og:image" content="https://market.opentabs.app/og-image.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="OpenTabs packs — a topic someone spent an hour assembling, as one click" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="OpenTabs packs" />
  <meta name="twitter:description" content="A topic someone spent an hour assembling, as one click." />
  <meta name="twitter:image" content="https://market.opentabs.app/og-image.png" />
</head>
<body>
  <div class="wrap">
    <header class="masthead">
      <div>
        <a class="brand" href="#/"><span class="brand-tile" aria-hidden="true"><svg viewBox="0 0 32 32" width="16" height="16" fill="currentColor"><rect x="5.76" y="7.68" width="20.48" height="5.12" rx="1"/><rect x="5.76" y="14.72" width="16" height="4.48" rx="1" opacity=".62"/><rect x="5.76" y="21.12" width="12.16" height="4.48" rx="1" opacity=".62"/></svg></span><span class="brand-word"><span class="muted">Open</span>Tabs<span class="dot">.</span><span class="sub">packs</span></span></a>
        <p class="tagline">
          A topic someone spent an hour assembling, as one click. Nothing about you is
          stored to browse, and nothing is stored to install.
        </p>
      </div>
      <button class="btn" id="auth">Sign in</button>
    </header>

    <div class="controls">
      <nav class="sortnav" id="sortnav">
        <button data-sort="trending" class="on">Trending</button>
        <button data-sort="top">Top</button>
        <button data-sort="new">New</button>
      </nav>
      <input id="search" type="search" placeholder="Search packs — “real estate”, “arxiv”, a name…" aria-label="Search packs" />
    </div>

    <div class="tagrow" id="tagrow"></div>

    <main id="view"></main>

    <footer class="footer">
      <span>Publish from OpenTabs: Settings → the group you want → Share.</span>
      <a href="https://opentabs.app">opentabs.app</a>
    </footer>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
