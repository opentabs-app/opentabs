<!doctype html>
<html lang="en" class="oa-auto">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>New Tab</title>
  <link rel="stylesheet" href="../styles/main.css" />
</head>
<body>
  <!--
    Deliberately near-empty. The page paints from one storage read; markup
    that the renderer would immediately replace only costs a reflow.
  -->
  <div class="wrap">
    <header class="masthead">
      <div>
        <h1 class="greeting" id="greeting"></h1>
        <div class="datel" id="date"></div>
      </div>
      <div class="masthead-right">
        <span class="datel mono" id="tabcount"></span>
        <!--
          The marketplace, named and marked rather than hidden behind a
          settings pane nobody opens. It carries the product's own tile so
          the packs read as part of OpenTabs and not somewhere else you are
          being sent.
        -->
        <button class="packsbtn" id="packs" title="Browse packs — topics and themes other people assembled">
          <span class="brand-tile" aria-hidden="true">
            <svg viewBox="0 0 32 32" width="13" height="13" fill="currentColor">
              <rect x="5.76" y="7.68" width="20.48" height="5.12" rx="1"/>
              <rect x="5.76" y="14.72" width="16" height="4.48" rx="1" opacity=".62"/>
              <rect x="5.76" y="21.12" width="12.16" height="4.48" rx="1" opacity=".62"/>
            </svg>
          </span>
          <span>Packs</span>
        </button>
        <!--
          Rendered signed-out. The worker is asked for the real state right
          after paint and swaps the icon if it differs — asking first would
          put a message round-trip on the critical path of a page that opens
          fifty times a day, to change one glyph.
        -->
        <button class="iconbtn" id="account" title="Sign in" aria-label="Sign in">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
          <span class="acct-dot" id="accountdot" hidden></span>
        </button>
        <button class="iconbtn" id="settings" title="Settings" aria-label="Settings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3" />
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.2.61.77 1 1.42 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
          </svg>
        </button>
      </div>
    </header>

    <form class="promptbar" id="promptbar" autocomplete="off">
      <input id="prompt" placeholder="Ask, or search — !c Claude · !p Perplexity · !g Google" aria-label="Prompt" />
      <button type="button" class="assistant" id="assistant"></button>
    </form>

    <main class="grid" id="grid"></main>

    <footer class="footer">
      <span>OpenTabs — your tabs never leave this browser.</span>
    </footer>
  </div>

  <script type="module" src="./newtab.ts"></script>
</body>
</html>
