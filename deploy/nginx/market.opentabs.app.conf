# BOOTSTRAP TEMPLATE — NOT A COPY OF WHAT IS ON THE SERVER.
#
# This is what a fresh host needs *before* certbot has ever run. Once certbot
# touches the live file it adds `listen 443 ssl`, the certificate paths and
# the HTTP→HTTPS redirect, and those live only on the server.
#
# So this file is a starting point, never a newer version. Copying it over a
# certbot-managed config deletes the TLS block — silently, because nginx
# keeps serving from memory until something reloads it, possibly hours later
# for an unrelated reason. Diff before you copy:
#
#   ssh root@104.36.65.54 'cat /etc/nginx/sites-available/<this file>' \
#     | diff - <this file>
#
# Anything shown as server-only is certbot's, and you would be destroying it.

# market.opentabs.app — the pack marketplace: the site and its API, on one
# hostname.
#
# THIS IS THE DESIGN DECISION IN THIS FILE. The static site and the API share
# an origin, so every call the site makes is same-origin: no preflight on the
# path that matters, no CORS allow-list that can be wrong, and one hostname
# for a reader to see instead of two. The API's own CORS layer exists for the
# *extension*, which is genuinely a different origin and always will be.
#
# The order below matters. `/v1/` is declared before `/`, and `location /`
# ends in `try_files … /index.html` — so without the proxy block first, an
# API call would be answered with the marketplace's HTML and a 200, which is
# a far more confusing failure than a 404.
server {
    listen 80;
    listen [::]:80;
    server_name market.opentabs.app;

    root /var/www/opentabs-market;
    index index.html;

    # The API. Everything under /v1/ belongs to market-api and nothing else.
    location /v1/ {
        proxy_pass http://127.0.0.1:8095;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Publishing sends a pack document; the service caps it at 1 MB and
        # nginx should not refuse it first with a 413 the client cannot read.
        client_max_body_size 2m;
        proxy_read_timeout 30s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8095;
        access_log off;
    }

    # Vite fingerprints everything under /assets/, so it can be immutable.
    location /assets/ {
        include snippets/opentabs-security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # The vendored OpenApps sign-in element. Content-hashed in its filename
    # by the bundler that produced it, so it is immutable too — and it is
    # only fetched by someone who pressed Sign in.
    location /openapps/ {
        include snippets/opentabs-security.conf;
        add_header Cache-Control "public, max-age=604800" always;
    }

    location = /index.html {
        include snippets/opentabs-security.conf;
        add_header Cache-Control "no-cache" always;
    }

    # A single-page app: every unknown path serves index.html, so a link to
    # /#/pack/<id> survives a refresh.
    location / {
        include snippets/opentabs-security.conf;
        try_files $uri $uri/ /index.html;
    }
}
