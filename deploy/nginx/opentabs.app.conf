# BOOTSTRAP TEMPLATE — NOT A COPY OF WHAT IS ON THE SERVER.
#
# This is what a fresh host needs *before* certbot has ever run. Once certbot
# touches the live file it adds `listen 443 ssl`, the certificate paths and
# the HTTP→HTTPS redirect, and those live only on the server.
#
# So this file is a starting point, never a newer version. Copying it over a
# certbot-managed config deletes the TLS block — silently, because nginx
# keeps serving from memory until something reloads it, possibly hours later
# for an unrelated reason. Diff before you copy:
#
#   ssh root@104.36.65.54 'cat /etc/nginx/sites-available/<this file>' \
#     | diff - <this file>
#
# Anything shown as server-only is certbot's, and you would be destroying it.

# opentabs.app + www — the product site, and the feeds the extension reads.
#
# Two jobs on one hostname, deliberately. `tabs-feedgen` writes two static
# JSON files under /tabs/v1/, and serving them from the site means the
# extension asks for permission to reach **its own product's domain** rather
# than a stranger's. A browser names the host in that prompt, and
# "OpenTabs wants to communicate with openapps.network" is the single most
# off-putting sentence in an install flow.
server {
    listen 80;
    listen [::]:80;
    server_name opentabs.app;

    root /var/www/opentabs;
    index index.html;

    # The feeds. Regenerated daily by cron, so a short cache — and CORS,
    # because the reader of these is an extension page, which is a different
    # origin from this one however you look at it.
    #
    # `*` is correct here and is not a loosening: these two files are public,
    # identical for everyone, and carry nothing about anybody. There is no
    # cookie on this host for a wildcard to expose.
    location /tabs/v1/ {
        include snippets/opentabs-security.conf;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=900" always;
        types { application/json json; }
        default_type application/json;
    }

    location ~* \.(png|svg|ico|jpg|woff2)$ {
        include snippets/opentabs-security.conf;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # Short, so a copy change is live in minutes rather than after a
    # visitor's cache expires.
    location = /index.html {
        include snippets/opentabs-security.conf;
        add_header Cache-Control "public, max-age=300" always;
    }
    location = /privacy.html {
        include snippets/opentabs-security.conf;
        add_header Cache-Control "public, max-age=300" always;
    }

    location / {
        include snippets/opentabs-security.conf;
        try_files $uri $uri/ =404;
    }
}

# One canonical URL, one place to deploy to.
server {
    listen 80;
    listen [::]:80;
    server_name www.opentabs.app;
    return 301 https://opentabs.app$request_uri;
}
