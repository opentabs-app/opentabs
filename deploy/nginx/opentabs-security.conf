# Security headers, in one place because they must be repeated in every
# location block that sets an `add_header` of its own.
#
# `add_header` does not accumulate across levels: a location that declares
# one inherits *none* from the server block. Without an `include` in each
# such location, these headers vanish from exactly the responses that carry
# the code — which is the opposite of what anyone reading the config expects.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
