# BOOTSTRAP TEMPLATE — NOT A COPY OF WHAT IS ON THE SERVER.
#
# This is what a fresh host needs *before* certbot has ever run. Once certbot
# touches the live file it adds `listen 443 ssl`, the certificate paths and
# the HTTP→HTTPS redirect, and those live only on the server.
#
# So this file is a starting point, never a newer version. Copying it over a
# certbot-managed config deletes the TLS block — silently, because nginx
# keeps serving from memory until something reloads it, possibly hours later
# for an unrelated reason. Diff before you copy:
#
#   ssh root@104.36.65.54 'cat /etc/nginx/sites-available/<this file>' \
#     | diff - <this file>
#
# Anything shown as server-only is certbot's, and you would be destroying it.

# auth.opentabs.app — OpenApps accounts and sign-in, under our own name.
#
# A reverse proxy onto the platform server that is already running on this
# box for the other products. Same service, same account, same credit ledger
# — sessions are bearer tokens rather than cookies, so nothing about identity
# is domain-scoped and a second hostname changes nothing functionally.
#
# What it changes is what a user is shown. Someone who installed OpenTabs has
# never heard of openapps.network, and it would otherwise appear in the two
# places least suited to a stranger's domain: the address bar during sign-in,
# and a browser permission prompt.
#
# WHAT THIS DOES NOT HIDE, said plainly so nobody files it as a bug: Google
# sign-in visibly bounces through accounts.openapps.network on the OAuth
# callback hop, and a wallet signature prompt names that host. The server
# builds both once at startup from its own public_url, so no hostname added
# here changes them.
#
# There is deliberately no `gateway.opentabs.app`. That host exists for
# products that spend credits on work done on our servers; OpenTabs does
# every piece of its work on the reader's own machine, so there is nothing to
# meter and no key to hold.
server {
    listen 80;
    listen [::]:80;
    server_name auth.opentabs.app;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Longer than the server's own 30s request timeout, so it is the one
        # that decides.
        proxy_read_timeout 60s;
    }
}
